name: GitHub Pages

# Veröffentlicht die Übersichtsseite und alle Werkzeuge bei jedem Push auf den
# Standard-Branch: index.html → /3D-Druck/, jeder Ordner mit einer index.html
# (z. B. MusterGenerator/) → /3D-Druck/<Ordner>/.
# Einmalig nötig: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prüfen, ob GitHub Pages aktiviert ist
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages ist noch nicht aktiviert::Settings → Pages → Build and deployment → Source: GitHub Actions wählen und diesen Workflow erneut starten."
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - name: Seite zusammenstellen
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/
          # Gemeinsamer Code der Werkzeuge (Bedienelemente, Design, Bibliotheken).
          cp -r shared _site/shared
          rm -f _site/shared/README.md
          for dir in */; do
            tool="${dir%/}"
            [ "$tool" != _site ] && [ "$tool" != shared ] && [ -f "$tool/index.html" ] || continue
            # Nicht auf die Seite: Tests, Doku-Bilder, Quellen der Fusion-Skripte.
            cp -r "$tool" "_site/$tool"
            rm -rf "_site/$tool/tests" "_site/$tool/docs" "_site/$tool/fusion360" "_site/$tool/README.md"
            # Fusion-Skripte (fusion360/<Name>/) als fusion/<Name>.zip zum Herunterladen.
            if [ -d "$tool/fusion360" ]; then
              mkdir -p "_site/$tool/fusion"
              for script in "$tool"/fusion360/*/; do
                [ -d "$script" ] || continue
                name="$(basename "$script")"
                (cd "$tool/fusion360" && zip -qr "$GITHUB_WORKSPACE/_site/$tool/fusion/$name.zip" "$name" -x '*/settings.json' '*/__pycache__/*')
              done
            fi
            echo "Veröffentlicht: /$tool/"
          done
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: _site
      - name: Veröffentlichen
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
